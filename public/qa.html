<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visual QA capture</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #play { position: fixed; inset: 0; }
      #game { display: block; width: 100%; height: 100%; }
      #hudLayer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
      #hudLayer button { pointer-events: auto; }
    </style>
  </head>
  <body>
    <!-- Lab-owned harness used by server/agent/visualQa.js (headless screenshots). Not part of the game. -->
    <div id="play">
      <canvas id="game" tabindex="0"></canvas>
      <div id="hudLayer" data-play-hud="overlay"></div>
    </div>
    <script type="module">
      const q = new URLSearchParams(location.search);
      if (q.get("auto") === "1") window.__PLAB_AUTOPLAY = true;
      try {
        const mod = await import(`/gameplay/main.js?t=${Date.now()}`);
        if (typeof mod.mount !== "function") throw new Error("main.js does not export mount()");
        await mod.mount(document.getElementById("game"), { hudRoot: document.getElementById("hudLayer") });
        window.__qaMounted = true;
        let frames = 0;
        const t0 = performance.now();
        const tick = () => {
          frames += 1;
          window.__qaFps = frames / Math.max(0.001, (performance.now() - t0) / 1000);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      } catch (err) {
        window.__qaError = String(err?.message || err);
        console.error("[qa] mount failed", err);
      }
    </script>
  </body>
</html>
